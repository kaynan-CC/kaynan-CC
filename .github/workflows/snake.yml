name: Generate Snake on: schedule: - cron: "0 0 * * *" workflow_dispatch: {} push: branches: [ main ] jobs: generate: runs-on: ubuntu-latest permissions: contents: write steps: - uses: Platane/snk@v3 with: github_user_name: ${{ github.repository_owner }} outputs: | dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg?palette=github-dark - uses: actions/checkout@v4 with: ref: output - run: | git config user.name github-actions git config user.email github-actions@github.com git add -A git commit -m "snake animation" || echo "no changes" git push
